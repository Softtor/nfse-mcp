[project]
name = "nfse-mcp"
version = "1.0.0"
description = "MCP Server para emissão de NFS-e (Brasília/DF - ISS.net ABRASF 2.04)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Softtor Soluções Transformadoras LTDA" },
]
keywords = ["mcp", "nfse", "nota-fiscal", "abrasf", "brasilia", "iss"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "lxml>=5.0.0",
    "cryptography>=42.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Repository = "https://github.com/Softtor/nfse-mcp"
Issues = "https://github.com/Softtor/nfse-mcp/issues"

[project.scripts]
nfse-mcp = "nfse_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nfse_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/nacional" = "nfse_mcp/schemas/nacional"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    # verificador independente de assinatura nos testes de xml_signer.
    # nao e usado em runtime: o signer e manual porque signxml bloqueia SHA-1.
    "signxml>=4.4.0",
]
